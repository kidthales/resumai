ai:
    platform:
        # Inference Platform configuration
        # see https://github.com/symfony/ai/tree/main/src/platform#platform-bridges

    agent:
        # Agent configuration
        # see https://symfony.com/doc/current/ai/bundles/ai-bundle.html

        resume_archetype_selector.ollama:
            platform: ai.platform.ollama
            model: '%resume_archetype_selector.ollama.model%'
            prompt: '%prompts.resume_archetype_selector%'
            tools:
                enabled: true
                services:
                    - service: App\AI\Agent\Toolbox\ArchetypeDirectoryTool
        resume_archetype_selector.gemini:
            platform: ai.platform.gemini
            model: '%resume_archetype_selector.gemini.model%'
            prompt: '%prompts.resume_archetype_selector%'
            tools:
                enabled: true
                services:
                    - service: App\AI\Agent\Toolbox\ArchetypeDirectoryTool

        resume_drafter.ollama:
            platform: ai.platform.ollama
            model: '%resume_drafter.ollama.model%'
            prompt: '%prompts.resume_drafter%'
        resume_drafter.gemini:
            platform: ai.platform.gemini
            model: '%resume_drafter.gemini.model%'
            prompt: '%prompts.resume_drafter%'

        resume_fact_checker.ollama:
            platform: ai.platform.ollama
            model: '%resume_fact_checker.ollama.model%'
            prompt: '%prompts.resume_fact_checker%'
        resume_fact_checker.gemini:
            platform: ai.platform.gemini
            model: '%resume_fact_checker.gemini.model%'
            prompt: '%prompts.resume_fact_checker%'

        resume_job_alignment_checker.ollama:
            platform: ai.platform.ollama
            model: '%resume_job_alignment_checker.ollama.model%'
            prompt: '%prompts.resume_job_alignment_checker%'
        resume_job_alignment_checker.gemini:
            platform: ai.platform.gemini
            model: '%resume_job_alignment_checker.gemini.model%'
            prompt: '%prompts.resume_job_alignment_checker%'

        resume_editor.ollama:
            platform: ai.platform.ollama
            model: '%resume_editor.ollama.model%'
            prompt: '%prompts.resume_editor%'
        resume_editor.gemini:
            platform: ai.platform.gemini
            model: '%resume_editor.gemini.model%'
            prompt: '%prompts.resume_editor%'

    store:
        # Store configuration

        # chromadb:
        #    default:
        #        client: 'client.service.id'
        #        collection: 'my_collection'
