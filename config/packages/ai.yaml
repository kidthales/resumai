ai:
    platform:
        # Inference Platform configuration
        # see https://github.com/symfony/ai/tree/main/src/platform#platform-bridges

        ollama:
            http_client: ollama.client

    agent:
        # Agent configuration
        # see https://symfony.com/doc/current/ai/bundles/ai-bundle.html

        resume_drafter:
            platform: ai.platform.ollama
            model: resume-drafter
            prompt: '%prompts.resume_drafter%'

        archetype_selector:
            platform: ai.platform.ollama
            model: archetype-selector
            prompt: '%prompts.archetype_selector%'
            tools:
                enabled: true
                services:
                    - service: App\AI\Tool\ArchetypeDirectoryTool

    store:
        # Store configuration

        # chromadb:
        #    default:
        #        client: 'client.service.id'
        #        collection: 'my_collection'
