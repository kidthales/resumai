---
name: CI

on:
  push:
    branches:
      - main
      - "src-main/epic/55-*"
  pull_request:
    branches:
      - main
      - "src-main/epic/55-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Verify Go formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files detected:"
            echo "$unformatted"
            exit 1
          fi
          echo "All Go source files formatted properly."

      - name: Run Go vet
        run: go vet ./...

      - name: Run unit & boundary tests
        run: go test -v ./...

      - name: Run tests with race detector
        shell: bash
        run: |
          if command -v gcc >/dev/null 2>&1; then
            go test -race ./...
          else
            echo "Notice: gcc not found in PATH; skipping -race on this runner."
          fi

      - name: Validate PowerShell scripts AST
        shell: pwsh
        run: |
          $psFiles = Get-ChildItem -Path scripts -Filter "*.ps1" -File -Recurse
          foreach ($file in $psFiles) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "Syntax error in script $($file.FullName)"
              exit 1
            }
          }
          Write-Host "All $($psFiles.Count) PowerShell scripts passed AST validation."

      - name: Build production binary
        run: go build -ldflags="-s -w" -o bin/resumai ./cmd/resumai
