---
name: CI

on:
  push:
    branches:
      - main
      - main-v2
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Unit & Headless UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint formatting
        run: npm run lint
      - name: Typecheck & build frontend
        run: npm run build
      - name: Run Vitest headless UI test suite
        run: npm run test:unit

  browser-e2e:
    name: Browser Engine & Pixel Layout Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium & dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Playwright layout tests
        run: npm run test:e2e

  rust-core:
    name: Rust Backend Unit & Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Linux WebKitGTK system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  notify:
    name: Notify Discord (#dev-ci-builds)
    needs: [frontend, browser-e2e, rust-core]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Discord Webhook
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
          JOB_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Warning: No DISCORD_CI_WEBHOOK configured. Skipping notification."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=4388484
            STATUS_ICON="✅"
            TITLE="CI Suite Passed: $REPO_NAME"
          elif [ "$JOB_STATUS" = "failure" ]; then
            COLOR=15088454
            STATUS_ICON="❌"
            TITLE="CI Suite Failed: $REPO_NAME"
          else
            COLOR=13202208
            STATUS_ICON="⚠️"
            TITLE="CI Suite Cancelled: $REPO_NAME"
          fi

          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          RUN_URL="$SERVER_URL/$REPO_NAME/actions/runs/$RUN_ID"

          PAYLOAD=$(cat <<EOF
          {
            "username": "kidthales CI/CD",
            "avatar_url": "https://github.com/kidthales.png",
            "embeds": [
              {
                "title": "$STATUS_ICON $TITLE",
                "color": $COLOR,
                "description": "CI test suite (Frontend, Playwright E2E, Rust Core) completed for branch \`$BRANCH_NAME\`.",
                "url": "$RUN_URL",
                "author": {
                  "name": "kidthales Systems CI",
                  "icon_url": "https://github.com/kidthales.png"
                },
                "fields": [
                  { "name": "Repository", "value": "\`$REPO_NAME\`", "inline": true },
                  { "name": "Branch", "value": "\`$BRANCH_NAME\`", "inline": true },
                  { "name": "Triggered By", "value": "@$ACTOR", "inline": true },
                  { "name": "Workflow", "value": "$WORKFLOW_NAME", "inline": true },
                  { "name": "Commit", "value": "[\`$SHORT_SHA\`]($SERVER_URL/$REPO_NAME/commit/$COMMIT_SHA)", "inline": true },
                  { "name": "Run Details", "value": "[View Run]($RUN_URL)", "inline": true }
                ],
                "footer": {
                  "text": "kidthales Automation • Antigravity",
                  "icon_url": "https://github.com/kidthales.png"
                },
                "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              }
            ]
          }
          EOF
          )

          curl -s -S -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL" > /dev/null || echo "Warning: Discord webhook dispatch failed."

