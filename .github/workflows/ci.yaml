---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          targets: php
          files: |
            docker/docker-bake.hcl
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max

      - name: Start services
        run: cd docker && docker compose -f compose.yaml -f compose.ci.yaml up --wait --no-build

      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      # Uncomment when the homepage is configured, or change the path to check
      # - name: Check HTTPS reachability
      #   run: curl -v --insecure --fail-with-body https://localhost
      - name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test
      # Uncomment if Doctrine ORM is installed
      # - name: Create test database
      #   run: docker compose exec -T php bin/console -e test doctrine:database:create
      # Uncomment if Doctrine Migrations is installed
      # - name: Run migrations
      #   run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      # Uncomment if PHPUnit is installed
      - name: Run PHPUnit
        run: cd docker && docker compose exec -T php bin/phpunit
      # Uncomment if Doctrine ORM is installed
      # - name: Doctrine Schema Validator
      #   run: docker compose exec -T php bin/console -e test doctrine:schema:validate

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        id: setup-node
        background: true
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Setup PHP
        id: setup-php
        background: true
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Wait for setups
        wait: [setup-node, setup-php]

      - name: Install vendor/
        run: composer install --no-progress --no-interaction
      - name: Install node_modules
        run: npm ci

      - name: Prettier
        id: prettier
        background: true
        run: npx prettier --check .
      - name: PHP CS Fixer
        id: php-cs-fixer
        background: true
        run: php vendor/bin/php-cs-fixer check

      - name: Wait for linters
        wait: [prettier, php-cs-fixer]
