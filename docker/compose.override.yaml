services:
  php:
    image: ${IMAGES_PREFIX:-resumai}:dev-php-${IMAGES_TAG:-latest}
    environment:
      FRANKENPHP_SITE_CONFIG: hot_reload
      FRANKENPHP_WORKER_CONFIG: watch
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: '${XDEBUG_MODE:-develop}'
    volumes:
      - ../:/app
      - ./php/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./php/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  node:
    image: ${IMAGES_PREFIX:-resumai}:dev-node-${IMAGES_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - ../:/app
    tty: true

  ollama:
    image: ${IMAGES_PREFIX:-resumai}:dev-ollama-${IMAGES_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - ollama_storage:/root/.ollama
      - ../modelfiles:/modelfiles:ro
    tty: true

  pandoc:
    image: pandoc/core:3.11
    restart: no
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - ../:/data
    command:
      - --help
    tty: true

volumes:
  ollama_storage:
