services:
  php:
    image: ${IMAGES_PREFIX:-resumai}:dev-php-${IMAGES_TAG:-latest}
    hostname: resumai-dev-php
    environment:
      FRANKENPHP_SITE_CONFIG: hot_reload
      FRANKENPHP_WORKER_CONFIG: watch
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: '${XDEBUG_MODE:-develop}'
    volumes:
      - ../:/app
      - ./php/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./php/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  node:
    image: ${IMAGES_PREFIX:-resumai}:dev-node-${IMAGES_TAG:-latest}
    hostname: resumai-dev-node
    volumes:
      - ../:/app
    tty: true

  ollama:
    image: ${IMAGES_PREFIX:-resumai}:dev-ollama-${IMAGES_TAG:-latest}
    hostname: resumai-dev-ollama
    volumes:
      - ../var/.ollama:/root/.ollama
      - ../ollama:/ollama:ro
    tty: true
